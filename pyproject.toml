[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parentheses"
version = "1.1.0.dev0"
description = "A recurrent language model with constant-size state"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.4", "safetensors>=0.4", "tokenizers>=0.15"]

[project.optional-dependencies]
eval = ["lm_eval>=0.4.9"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
parentheses = ["tokenizer_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
